name: Build macOS App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64 

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Java App with Gradle
        run: ./gradlew build

      # Собираем все нужные файлы в папку, которую jpackage упакует в Contents/app
      - name: Prepare Bundle Resources
        run: |
          # Копируем бинарник
          cp input_libs/wireproxy/wireproxy app/build/libs/
          # Копируем оба конфига
          cp input_libs/wireproxy/proxy.conf app/build/libs/
          cp input_libs/wireproxy/WARPw13768.conf app/build/libs/
          
          chmod +x app/build/libs/wireproxy
          echo "Files ready for jpackage:"
          ls -lh app/build/libs/

      - name: Create Package (jpackage)
        run: |
          jpackage --name "MyStatusTool" \
                   --type dmg \
                   --input app/build/libs/ \
                   --main-jar app.jar \
                   --main-class org.example.App \
                   --dest output/ \
                   --java-options "-Dapple.awt.UIElement=true"
                   
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Intel-App
          path: output/