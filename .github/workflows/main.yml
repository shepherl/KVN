name: Build macOS App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Java App with Gradle
        run: ./gradlew build

      # Подготавливаем всё содержимое для папки Contents/app
      - name: Prepare Bundle Resources
        run: |
          # Копируем бинарники и ВСЕ конфиги из твоих папок
          cp input_libs/wireproxy/wireproxy app/build/libs/
          cp input_libs/wireproxy/*.conf app/build/libs/
          cp input_libs/Opera-proxy/opera-proxy.darwin-amd64 app/build/libs/

          chmod +x app/build/libs/wireproxy
          chmod +x app/build/libs/opera-proxy.darwin-amd64
          echo "Files in build folder:"
          ls -lh app/build/libs/

      - name: Create Custom JRE
        run: |
          MODULES=$(jdeps --print-module-deps \
            --ignore-missing-deps \
            --recursive \
            --multi-release 21 \
            --class-path "app/build/libs/*" \
            app/build/libs/app.jar)
          
          echo "Detected modules: $MODULES"

          jlink --add-modules "$MODULES,jdk.crypto.ec,java.net.http,java.naming" \
                --strip-debug \
                --no-man-pages \
                --no-header-files \
                --compress=2 \
                --output custom-runtime

      - name: Create Package (jpackage)
        run: |
          jpackage --name "KVN" \
                   --type app-image \
                   --runtime-image custom-runtime \
                   --input app/build/libs/ \
                   --main-jar app.jar \
                   --icon app/src/main/resources/kvn_logo_dock.icns \
                   --main-class org.example.App \
                   --dest output/ \
                   --java-options "-Dapple.awt.UIElement=true"

      - name: Compile Swift Autostart Helper (Intel)
        run: |
          # Путь к исходнику
          SWIFT_SRC="app/src/main/swift/AutoStart.swift"
          
          # Компилируем под Intel (x86_64) и называем результат AutoStart
          swiftc "$SWIFT_SRC" -target x86_64-apple-macosx13.0 -o AutoStart
          
          # Закидываем внутрь собранного бандла
          DEST_DIR="output/KVN.app/Contents/MacOS"
          mkdir -p "$DEST_DIR"
          cp AutoStart "$DEST_DIR/"
          chmod +x "$DEST_DIR/AutoStart"
          
          echo "AutoStart helper successfully injected into $DEST_DIR"
          
      - name: Build Smart DMG (Universal Link)
        run: |
          mkdir -p dmg_root
          cp -R "output/KVN.app" dmg_root/
          
          # ХАК: Вместо пути к runner, мы создаем относительную ссылку.
          # В macOS точка ".." внутри корня DMG иногда может выкинуть в папку пользователя,
          # но самый надежный способ для No-Sudo — это ссылка на /Users
          ln -s /Users dmg_root/Users_Folder
          
          # Или попробуем сделать "ленивый" симлинк, который подхватит текущего юзера
          # Мы создаем его без указания полного пути.
          cd dmg_root
          ln -s ~/Desktop "Desktop"
          cd ..

          mkdir -p final_dist
          hdiutil create -volname "KVN Installation" \
                         -srcfolder dmg_root \
                         -ov -format UDZO \
                         "final_dist/KVN_NoSudo.dmg"
          
          # Проверка в логах
          ls -lh final_dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Intel-App
          path: final_dist/KVN_NoSudo.dmg