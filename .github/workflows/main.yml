name: Build macOS App
on: [push] # Собирать при каждом пуше в репозиторий

jobs:
  build:
    runs-on: macos-13 # Запускаем на сервере Apple
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create Package (jpackage)
        run: |
          jpackage --name "MyStatusTool" \
                   --input app/build/libs/ \
                   --main-jar app.jar \
                   --main-class org.example.App \
                   --dest output/ \
                   --mac-package-name "MyStatusTool" \
                   --arguments "-Dapple.awt.UIElement=true"
        # Замени org.example.App на свой класс и app.jar на имя твоего jar файла

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App
          path: output/