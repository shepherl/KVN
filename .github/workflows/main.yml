name: Build macOS App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64 

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Сначала собираем Java, чтобы Gradle создал папку build/libs
      - name: Build Java App with Gradle
        run: ./gradlew build

      # Теперь копируем твой ГОТОВЫЙ бинарник в папку к JAR-файлу
      - name: Prepare Bundle (Add Go Binary)
        run: |
          # Предполагаем, что ты положил wireproxy в корень репозитория
          cp input_libs/wireproxy/wireproxy app/build/libs/
          chmod +x app/build/libs/wireproxy
          ls -lh app/build/libs/ # Проверка в логах, что оба файла на месте

      # jpackage упакует ВСЁ содержимое папки --input в одно место
      - name: Create Package (jpackage)
        run: |
          jpackage --name "MyStatusTool" \
                   --type dmg \
                   --input app/build/libs/ \
                   --main-jar app.jar \
                   --main-class org.example.App \
                   --dest output/ \
                   --java-options "-Dapple.awt.UIElement=true"
                   
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Intel-App
          path: output/