name: Build macOS App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Java App with Gradle
        run: ./gradlew build

      # Подготавливаем всё содержимое для папки Contents/app
      - name: Prepare Bundle Resources
        run: |
          # Копируем бинарник и ВСЕ конфиги из твоей папки
          cp input_libs/wireproxy/wireproxy app/build/libs/
          cp input_libs/wireproxy/*.conf app/build/libs/

          chmod +x app/build/libs/wireproxy
          echo "Files in build folder:"
          ls -lh app/build/libs/

      - name: Create Custom JRE
        run: |
          MODULES=$(jdeps --print-module-deps \
            --ignore-missing-deps \
            --recursive \
            --multi-release 21 \
            --class-path "app/build/libs/*" \
            app/build/libs/app.jar)
          
          echo "Detected modules: $MODULES"

          jlink --add-modules "$MODULES" \
                --strip-debug \
                --no-man-pages \
                --no-header-files \
                --compress=2 \
                --output custom-runtime

      - name: Create Package (jpackage)
        run: |
          jpackage --name "KVN" \
                   --type app-image \
                   --runtime-image custom-runtime \
                   --input app/build/libs/ \
                   --main-jar app.jar \
                   --icon app/src/main/resources/kvn_logo_dock.icns \
                   --main-class org.example.App \
                   --dest output/ \
                   --java-options "-Dapple.awt.UIElement=true"

          
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build Custom DMG with Desktop Link
        run: |
          # 1. Создаем папку для выходного файла (исправляет ошибку No such file or directory)
          mkdir -p dist
          
          # 2. Создаем симлинк на Desktop. 
          # В macOS GitHub Runner путь к рабочему столу именно такой:
          ln -s /Users/runner/Desktop "Desktop_Link"
          
          # 3. Запускаем create-dmg
          # Мы используем Desktop_Link, чтобы Finder не путался с системными именами
          create-dmg \
            --volname "KVN Install" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "KVN.app" 150 175 \
            --icon "Desktop_Link" 450 175 \
            --hide-extension "KVN.app" \
            "dist/KVN_NoSudo.dmg" \
            "output/KVN.app" "Desktop_Link"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Intel-App
          path: output/