name: Build macOS App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Java App with Gradle
        run: ./gradlew build

      # Подготавливаем всё содержимое для папки Contents/app
      - name: Prepare Bundle Resources
        run: |
          # Копируем бинарник и ВСЕ конфиги из твоей папки
          cp input_libs/wireproxy/wireproxy app/build/libs/
          cp input_libs/wireproxy/*.conf app/build/libs/

          chmod +x app/build/libs/wireproxy
          echo "Files in build folder:"
          ls -lh app/build/libs/

      - name: Create Custom JRE
        run: |
          MODULES=$(jdeps --print-module-deps \
            --ignore-missing-deps \
            --recursive \
            --multi-release 21 \
            --class-path "app/build/libs/*" \
            app/build/libs/app.jar)
          
          echo "Detected modules: $MODULES"

          jlink --add-modules "$MODULES" \
                --strip-debug \
                --no-man-pages \
                --no-header-files \
                --compress=2 \
                --output custom-runtime

      - name: Create Package (jpackage)
        run: |
          jpackage --name "KVN" \
                   --type app-image \
                   --runtime-image custom-runtime \
                   --input app/build/libs/ \
                   --main-jar app.jar \
                   --icon app/src/main/resources/kvn_logo_dock.icns \
                   --main-class org.example.App \
                   --dest output/ \
                   --java-options "-Dapple.awt.UIElement=true"

          
      - name: Build Reliable DMG (No-Sudo Version)
        run: |
          # 1. Создаем папку-песочницу для сборки
          mkdir -p dmg_root
          
          # 2. Копируем туда приложение
          cp -R "output/KVN.app" dmg_root/
          
          # 3. Создаем симлинк на Desktop прямо внутри этой папки
          # В DMG он будет выглядеть как обычный ярлык
          ln -s /Users/runner/Desktop "dmg_root/Desktop"
          
          # 4. Собираем DMG стандартным средством macOS
          # -srcfolder указывает, что взять за основу
          # -ov позволяет перезаписать файл
          # -format UDZO делает образ сжатым
          mkdir -p dist
          hdiutil create -volname "KVN Installation" \
                         -srcfolder dmg_root \
                         -ov -format UDZO \
                         "dist/KVN_NoSudo.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Intel-App
          path: output/