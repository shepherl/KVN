name: Build macOS App
on: [push]

jobs:
  build:
    runs-on: macos-latest # Используем самый быстрый сервер (M1)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64 # ФОКУС ТУТ: заставляем JDK работать в режиме эмуляции Intel

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create Package (jpackage)
        run: |
          jpackage --name "MyStatusTool" \
                   --input app/build/libs/ \
                   --main-jar app.jar \
                   --main-class org.example.App \
                   --dest output/
                   
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Intel-App
          path: output/